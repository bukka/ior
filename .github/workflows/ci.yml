name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-uring:
    name: Linux io_uring only (IOR_WITH_THREADS=OFF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev libcmocka-dev
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIOR_WITH_THREADS=OFF
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure
      
      - name: Print backend info
        run: |
          cd build/tests
          ./test_basic || true

  linux-threads:
    name: Linux threads backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
      
      - name: Configure (force threads)
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DIOR_WITH_URING=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Default Linux build, both backends in one library: CTest runs every common
  # test on each (the second time under IOR_BACKEND=threads), then the
  # installed header and ior.pc are used by a consumer as php-src would.
  linux-both:
    name: Linux io_uring + threads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev libcmocka-dev pkg-config

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/stage"

      # The static archive must link into a shared object (PIC) and pull in
      # liburing through pkg-config --static; IOR_BACKEND picks the backend.
      - name: Build and run a consumer
        run: |
          cat > consumer.c <<'EOF'
          #include <ior.h>
          #include <stdio.h>

          int consumer_backend(void)
          {
          	ior_ctx *ctx = NULL;
          	if (ior_queue_init(8, &ctx) < 0) {
          		return -1;
          	}
          	printf("%s\n", ior_get_backend_name(ctx));
          	ior_queue_exit(ctx);
          	return 0;
          }

          #ifndef CONSUMER_LIB
          int main(void)
          {
          	return consumer_backend() < 0;
          }
          #endif
          EOF
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig"
          FLAGS="$(pkg-config --cflags --static --libs ior)"
          cc -shared -fPIC -DCONSUMER_LIB consumer.c -o libconsumer.so $FLAGS
          cc consumer.c -o consumer $FLAGS
          test "$(./consumer)" = io_uring
          test "$(IOR_BACKEND=threads ./consumer)" = threads
          ! IOR_BACKEND=no-such-backend ./consumer

  linux-uring-asan:
    name: Linux io_uring + AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev libcmocka-dev
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DIOR_ENABLE_ASAN=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

  linux-threads-asan:
    name: Linux threads + AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DIOR_WITH_URING=OFF -DIOR_ENABLE_ASAN=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1

  linux-threads-tsan:
    name: Linux threads + ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DIOR_WITH_URING=OFF -DIOR_ENABLE_TSAN=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7:second_deadlock_stack=1

  macos:
    name: macOS (threads only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: brew install cmocka
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos-asan:
    name: macOS + AddressSanitizer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Install dependencies
        run: brew install cmocka
      
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DIOR_ENABLE_ASAN=ON
      
      - name: Build
        run: cmake --build build
      
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: halt_on_error=1

  # Both supported Visual Studio versions. windows-latest has meant Windows
  # Server 2025 with only VS 2026 since June 2026, so the images are named:
  # windows-2022 carries VS 2022 (v17), windows-2025 carries VS 2026 (v18).
  # The windows-msvc presets pick the newest VS on the image, so no pinning
  # is needed here.
  windows-iocp:
    name: Windows IOCP (${{ matrix.vs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            vs: MSVC, VS 2022
          - os: windows-2025
            vs: MSVC, VS 2026
    steps:
      - uses: actions/checkout@v5

      # Sets up the MSVC developer environment and sets VCPKG_ROOT to the
      # VS-bundled vcpkg, which the windows-msvc preset's toolchain path uses.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # No explicit "vcpkg install" step: cmocka is declared in vcpkg.json and
      # installed automatically at configure time via the vcpkg toolchain
      # (manifest mode). This works regardless of which vcpkg distribution
      # VCPKG_ROOT points at.
      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc

      - name: Test
        run: ctest --preset windows-msvc --output-on-failure

      - name: Print backend info
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter test_basic.exe build | Select-Object -First 1
          if ($exe) { & $exe.FullName } else { Write-Host "test_basic.exe not found" }

  windows-iocp-asan:
    name: Windows IOCP + AddressSanitizer (${{ matrix.vs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            vs: MSVC, VS 2022
          - os: windows-2025
            vs: MSVC, VS 2026
    steps:
      - uses: actions/checkout@v5

      # Sets up the MSVC developer environment (PATH, VCToolsInstallDir,
      # VCPKG_ROOT, etc.) for all later steps. The ASan tests need the
      # toolset's bin dir on PATH to load clang_rt.asan_dynamic-x86_64.dll at
      # run time; the preset toolchain path uses VCPKG_ROOT.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # cmocka comes from vcpkg.json at configure time (manifest mode).
      - name: Configure
        run: cmake --preset windows-msvc-asan

      - name: Build
        run: cmake --build --preset windows-msvc-asan

      - name: Test
        run: ctest --preset windows-msvc-asan --output-on-failure
